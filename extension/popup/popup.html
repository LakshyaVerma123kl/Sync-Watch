<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SyncWatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      :root {
        --bg:           #07080d;
        --bg2:          #0c0e17;
        --bg3:          #111420;
        --bg4:          #161929;
        --border:       rgba(255,255,255,0.055);
        --border2:      rgba(255,255,255,0.10);
        
        --accent:       #4f6ef7;
        --accent2:      #7c5af5;
        --accent-glow:  rgba(79,110,247,0.18);
        --accent-glow2: rgba(79,110,247,0.35);

        --green:        #00e5a0;
        --red:          #ff3d6b;
        --gold:         #e8b84b;

        --t1:           #f0f0fa;
        --t2:           #7e82a8;
        --t3:           #3a3d58;

        --font:         'Outfit', sans-serif;
        --mono:         'DM Mono', monospace;

        --r-sm:         8px;
        --r-md:         12px;
        --r-pill:       100px;
      }

      body {
        width: 320px;
        background: var(--bg);
        color: var(--t1);
        font-family: var(--font);
        overflow: hidden;
        position: relative;
      }

      /* Noise grain overlay */
      body::before {
        content: '';
        position: absolute; inset: 0; pointer-events: none; z-index: 0;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* Top accent line */
      body::after {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent 0%, var(--accent) 35%, var(--accent2) 65%, transparent 100%);
        opacity: 0.8; z-index: 1;
      }

      .wrap {
        padding: 24px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        position: relative;
        z-index: 1;
        background: linear-gradient(180deg, rgba(79,110,247,0.03) 0%, transparent 100%);
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo-area {
        display: flex; align-items: center; gap: 10px;
        font-size: 16px; font-weight: 800; color: var(--t1); letter-spacing: -0.4px;
      }
      .logo-mark {
        width: 32px; height: 32px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center;
        font-size: 14px; box-shadow: 0 0 16px rgba(79,110,247,0.4);
      }
      
      .conn-badge {
        display: flex; align-items: center; gap: 6px;
        font-size: 11px; font-weight: 600; color: var(--t2);
        padding: 4px 8px; background: var(--bg2); border: 1px solid var(--border);
        border-radius: var(--r-pill);
      }
      .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--red); box-shadow: 0 0 6px var(--red);
        transition: all 0.4s ease;
      }
      .dot.on {
        background: var(--green); box-shadow: 0 0 10px var(--green);
      }

      /* Room Info */
      .room-info {
        display: none;
        flex-direction: column;
        gap: 8px;
        background: var(--bg2); border: 1px solid var(--border2);
        border-radius: var(--r-md); padding: 14px;
        position: relative; overflow: hidden;
      }
      .room-info::before {
        content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.4;
      }
      .room-info.show { display: flex; }
      
      .room-lbl { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--t3); }
      .room-id-row { display: flex; align-items: center; justify-content: space-between; }
      .room-id {
        font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--accent);
        letter-spacing: 3px; text-transform: uppercase;
      }
      .members-pill {
        background: var(--bg3); border: 1px solid var(--border);
        border-radius: var(--r-pill); padding: 3px 8px;
        font-size: 10px; font-weight: 600; color: var(--t2);
      }

      /* Buttons */
      .btn {
        width: 100%; padding: 12px; border: none; border-radius: var(--r-sm);
        font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer;
        transition: all 0.16s ease; display: flex; align-items: center;
        justify-content: center; gap: 6px; letter-spacing: 0.2px;
      }
      .btn:active { transform: scale(0.97); }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff; box-shadow: 0 4px 16px rgba(79,110,247,0.35);
      }
      .btn-primary:hover { box-shadow: 0 6px 22px rgba(79,110,247,0.5); filter: brightness(1.08); }

      .btn-share {
        background: rgba(0,229,160,0.08); color: var(--green);
        border: 1px solid rgba(0,229,160,0.2);
        display: none;
      }
      .btn-share.show { display: flex; }
      .btn-share:hover { background: rgba(0,229,160,0.14); box-shadow: 0 4px 14px rgba(0,229,160,0.18); }

      /* Footer */
      .footer {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--border);
      }
      .hint { font-size: 10px; color: var(--t3); display: flex; align-items: center; gap: 4px; }
      kbd {
        background: var(--bg3); border: 1px solid var(--border);
        border-radius: 4px; padding: 2px 5px; font-family: var(--mono);
        font-size: 9px; color: var(--t2); box-shadow: 0 2px 0 var(--bg);
      }
      .links a {
        font-size: 10px; font-weight: 600; color: var(--t3); text-decoration: none; transition: color 0.2s;
      }
      .links a:hover { color: var(--t2); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="logo-area">
          <div class="logo-mark">🎬</div>
          SyncWatch
        </div>
        <div class="conn-badge">
          <div class="dot" id="dot"></div>
          <span id="status-text">Connecting…</span>
        </div>
      </div>

      <div class="room-info" id="room-info">
        <div class="room-lbl">Active Room</div>
        <div class="room-id-row">
          <div class="room-id" id="room-id"></div>
          <div class="members-pill" id="room-members">In room</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-primary" id="open-btn">🎬 Open Cinema Panel</button>
        <button class="btn btn-share" id="share-btn">🔗 Copy Invite Link</button>
      </div>

      <div class="footer">
        <div class="hint">Toggle <kbd>Alt</kbd>+<kbd>W</kbd></div>
        <div class="links">
          <a href="#" id="refresh-btn">Reconnect</a>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
