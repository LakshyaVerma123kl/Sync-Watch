<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SyncWatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #0a0a0f;
      color: #f0ece4;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    .popup-wrap {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      position: relative;
    }

    /* Subtle top shimmer */
    .popup-wrap::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e8b86d, transparent);
      opacity: 0.5;
    }

    .logo-area {
      text-align: center;
    }

    .logo-icon {
      font-size: 44px;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 20px rgba(232,184,109,0.4));
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #e8b86d;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 12px;
      color: #5a566a;
      margin-top: 4px;
      font-weight: 400;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111118;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 100px;
      padding: 7px 14px;
      font-size: 12px;
      color: #9994a8;
      width: 100%;
      justify-content: center;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 6px #ff4444;
      transition: all 0.4s;
    }
    .status-dot.on { background: #34c759; box-shadow: 0 0 8px #34c759; }

    #status-text { transition: color 0.3s; }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      outline: none;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: #e8b86d;
      color: #0a0a0f;
    }
    .btn-primary:hover {
      background: #f0c87a;
      box-shadow: 0 4px 20px rgba(232,184,109,0.35);
    }

    .divider {
      width: 100%;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .links {
      display: flex;
      gap: 16px;
      font-size: 11px;
    }
    .links a {
      color: #5a566a;
      text-decoration: none;
      transition: color 0.2s;
    }
    .links a:hover { color: #9994a8; }

    .room-info {
      background: #111118;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 12px 14px;
      width: 100%;
      font-size: 12px;
      color: #9994a8;
      display: none;
    }
    .room-info.visible { display: block; }
    .room-info strong { color: #e8b86d; font-weight: 600; }
  </style>
</head>
<body>
  <div class="popup-wrap">
    <div class="logo-area">
      <span class="logo-icon">🎬</span>
      <div class="logo-text">SyncWatch</div>
      <div class="tagline">Watch together, perfectly in sync</div>
    </div>

    <div class="status-row">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Checking connection…</span>
    </div>

    <div class="room-info" id="room-info">
      In room: <strong id="room-id-display"></strong>
    </div>

    <button class="btn btn-primary" id="open-btn">Open SyncWatch</button>

    <hr class="divider">
    <div class="links">
      <a href="https://github.com" target="_blank">GitHub</a>
      <a href="#" id="refresh-btn">Reconnect</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
